spring.application.name=LevelForge
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/levelforge?connectionTimeZone=UTC}
spring.datasource.username=${DB_USER:levelforge}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.session.jdbc.initialize-schema=never
spring.session.timeout=${SESSION_TIMEOUT:7d}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.error.include-message=never
server.error.include-stacktrace=never
server.forward-headers-strategy=none
