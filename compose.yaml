services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: levelforge
      MYSQL_USER: levelforge
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the root .env}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
  backend:
    profiles: ["full"]
    build: ./backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/levelforge?connectionTimeZone=UTC
      DB_USER: levelforge
      DB_PASSWORD: ${DB_PASSWORD}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      mysql:
        condition: service_healthy
  frontend:
    profiles: ["full"]
    build: ./frontend
    ports:
      - "127.0.0.1:8088:80"
    depends_on:
      - backend
volumes:
  mysql_data:

